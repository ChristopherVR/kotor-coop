name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Check package policy
        run: python -m unittest discover -s tools/publication -p 'test_package_policy.py'
      - name: Build solution
        run: dotnet build KotorCoop.slnx -c Release -warnaserror
      - name: Run regression tests
        run: dotnet test tests/KotorCoop.Tests -c Release --no-build --filter 'Category!=Soak'
      - name: Build native plugin
        run: pwsh -NoProfile -File src/KotorCoop.Plugin/build.ps1 -WarnAsError
      - name: Build native loader
        run: pwsh -NoProfile -File src/KotorCoop.Loader/build.ps1 -WarnAsError
