# Private development workflow. Only curated Windows binaries and scan evidence
# can be sent to the independent public repository; source refs never cross over.
name: Public release candidate
on:
  workflow_dispatch:
    inputs:
      reviewed_for_public_release:
        description: 'Confirm asset, legal, gameplay and release-note review is complete'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: public-release-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: inputs.reviewed_for_public_release
    environment: public-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate configuration
        shell: pwsh
        env:
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          if (-not $env:PUBLIC_RELEASE_TOKEN) { throw 'Configure a token limited to Contents write on ChristopherVR/kotor-coop in the public-release environment.' }
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid VERSION' }
          if (-not (Test-Path "docs/release-notes/v$version.md")) { throw 'Reviewed release notes are required.' }
      - name: Build and test
        shell: pwsh
        run: |
          dotnet build KotorCoop.slnx -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/KotorCoop.Tests --no-build --filter 'Category!=Soak'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/publication -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rebuild, scan and create a draft in the public repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          pwsh tools/Publish-PublicRelease.ps1 -Version $version -Directory artifacts/public-candidate -NotesFile "docs/release-notes/v$version.md" -ReleaseReviewed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
