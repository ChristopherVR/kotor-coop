# Publishes the build CI just validated. Runs AFTER the CI workflow completes successfully
# and reuses its packaged zip — the release is the exact artifact that passed the tests,
# never a second build.
#
#   push to main            -> CI green -> rolling pre-release "latest" (replaced every time)
#   git push origin v0.1.0  -> CI green -> full release "v0.1.0" with kotor-coop-0.1.0.zip
#   Actions tab (dispatch)  -> publishes the newest successful CI zip for the chosen ref as "latest"
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The ref CI built. For a workflow_run, head_branch is the branch name, or the tag
      # name when the push was a tag. For a manual run, whatever the workflow was started on.
      - name: Resolve what to publish
        id: what
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            ref='${{ github.event.workflow_run.head_branch }}'
            sha='${{ github.event.workflow_run.head_sha }}'
            run_id='${{ github.event.workflow_run.id }}'
          else
            ref='${{ github.ref_name }}'
            sha='${{ github.sha }}'
            run_id=$(gh run list --workflow CI --commit "$sha" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -z "$run_id" ]; then echo "no successful CI run for $sha"; exit 1; fi
          fi

          case "$ref" in
            v[0-9]*) kind=tag ;;
            main)    kind=latest ;;
            *)       echo "ref $ref is neither main nor a v* tag; nothing to publish"; kind=skip ;;
          esac

          echo "ref=$ref"       >> "$GITHUB_OUTPUT"
          echo "sha=$sha"       >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "kind=$kind"     >> "$GITHUB_OUTPUT"

      - name: Download the CI package
        if: steps.what.outputs.kind != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download '${{ steps.what.outputs.run_id }}' --name kotor-coop --dir dist
          ls -l dist

      - name: Publish release
        if: steps.what.outputs.kind != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls dist/kotor-coop-*.zip | head -n1)
          name=$(basename "$zip")
          ref='${{ steps.what.outputs.ref }}'
          sha='${{ steps.what.outputs.sha }}'
          kind='${{ steps.what.outputs.kind }}'
          size=$(du -k "$zip" | cut -f1)
          sha256=$(sha256sum "$zip" | cut -d' ' -f1)
          tag=$([ "$kind" = tag ] && echo "$ref" || echo latest)
          url="https://github.com/${{ github.repository }}/releases/download/$tag/$name"

          # The notes lead with the one thing a visitor is here for: the zip, a direct link
          # to it, and how to install it. GitHub lists assets below the notes, but nothing
          # there says which file is the build or what to do with it.
          {
            echo "## Download"
            echo
            echo "**[$name]($url)** — ${size} KB, ready to install. No SDK or toolchain needed."
            echo
            echo '```powershell'
            echo "# extract the zip, then from inside it:"
            echo "pwsh .\\install.ps1 -GameDir 'C:\\GOG Games\\Star Wars KOTOR (GOG)'"
            echo '```'
            echo
            echo "Contains the plugin (\`dinput8.dll\`), the chain loader, the agent, the override assets, \`coop.ini\`, \`install.ps1\` and a README that covers install, play, sharing \`dinput8.dll\` with another mod, and troubleshooting."
            echo
            echo "SHA-256 \`$sha256\` · built by CI run [${{ steps.what.outputs.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ steps.what.outputs.run_id }}) from \`${sha:0:7}\`."
            echo
            if [ "$kind" = latest ]; then
              echo "> Rolling build of \`main\`: every push that passes build + test replaces this release. Tagged releases are the stable ones."
              echo
            fi
          } > notes.md

          if [ "$kind" = tag ]; then
            # --generate-notes appends the auto-generated changelog after --notes-file.
            gh release create "$ref" "$zip" --title "$ref" --notes-file notes.md --generate-notes --verify-tag
          else
            # One rolling pre-release that always points at the newest green main build.
            # Delete + recreate rather than upload --clobber so the tag moves to the new sha
            # and the notes say which commit it is.
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest "$zip" --prerelease --target "$sha" \
              --title "latest (main @ ${sha:0:7})" --notes-file notes.md
          fi
