# Publishes the build CI just validated. Runs AFTER the CI workflow completes successfully
# and reuses its packages — the release is the exact pair of artifacts that passed the tests
# (and whose Linux tarball CI's linux-install job installed), never a second build.
#
#   push to main            -> CI green -> rolling pre-release "latest" (replaced every time)
#   git push origin v0.1.0  -> CI green -> full release "v0.1.0" with
#                              kotor-coop-0.1.0-windows.zip + kotor-coop-0.1.0-linux.tar.gz
#   Actions tab (dispatch)  -> publishes the newest successful CI packages for the chosen ref as "latest"
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The ref CI built. For a workflow_run, head_branch is the branch name, or the tag
      # name when the push was a tag. For a manual run, whatever the workflow was started on.
      - name: Resolve what to publish
        id: what
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            ref='${{ github.event.workflow_run.head_branch }}'
            sha='${{ github.event.workflow_run.head_sha }}'
            run_id='${{ github.event.workflow_run.id }}'
          else
            ref='${{ github.ref_name }}'
            sha='${{ github.sha }}'
            run_id=$(gh run list --workflow CI --commit "$sha" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -z "$run_id" ]; then echo "no successful CI run for $sha"; exit 1; fi
          fi

          case "$ref" in
            v[0-9]*) kind=tag ;;
            main)    kind=latest ;;
            *)       echo "ref $ref is neither main nor a v* tag; nothing to publish"; kind=skip ;;
          esac

          echo "ref=$ref"       >> "$GITHUB_OUTPUT"
          echo "sha=$sha"       >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "kind=$kind"     >> "$GITHUB_OUTPUT"

      # CI can pass without uploaded packages. Publishing is a separate promise: missing
      # artifacts must fail this workflow so a green Release cannot hide a stale download.
      - name: Download the CI packages
        id: download
        if: steps.what.outputs.kind != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh run download '${{ steps.what.outputs.run_id }}' --name kotor-coop --dir dist; then
            echo "::error::CI run ${{ steps.what.outputs.run_id }} has no downloadable packages; the release was not updated. Check the CI artifact upload and repository artifact quota."
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "Release not updated: CI packages could not be downloaded. Existing release assets are unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ls -l dist
          test -f dist/kotor-coop-*-windows.zip && test -f dist/kotor-coop-*-linux.tar.gz
          echo "have=yes" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.what.outputs.kind != 'skip' && steps.download.outputs.have == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls dist/kotor-coop-*-windows.zip | head -n1)
          tgz=$(ls dist/kotor-coop-*-linux.tar.gz | head -n1)
          zip_name=$(basename "$zip")
          tgz_name=$(basename "$tgz")
          ref='${{ steps.what.outputs.ref }}'
          sha='${{ steps.what.outputs.sha }}'
          kind='${{ steps.what.outputs.kind }}'
          zip_size=$(du -k "$zip" | cut -f1)
          tgz_size=$(du -k "$tgz" | cut -f1)
          zip_sha256=$(sha256sum "$zip" | cut -d' ' -f1)
          tgz_sha256=$(sha256sum "$tgz" | cut -d' ' -f1)
          version=${zip_name#kotor-coop-}; version=${version%-windows.zip}

          # The notes lead with the one thing a visitor is here for: which file is for their
          # machine, a direct link to it, and how to install it. GitHub lists assets below the
          # notes, but nothing there says which file is which or what to do with it.
          # $1 = the release tag the download links point at, $2 = tag | latest.
          make_notes() {
            local tag="$1" kind="$2"
            local base="https://github.com/${{ github.repository }}/releases/download/$tag"
            {
              echo "## Download"
              echo
              echo "| Platform | File | Install |"
              echo "| --- | --- | --- |"
              echo "| Windows | **[$zip_name]($base/$zip_name)** (${zip_size} KB) | extract into your KOTOR folder, or double-click \`KotorCoop.Agent.exe\` from anywhere |"
              echo
              echo "No SDK, runtime or toolchain needed."
              echo
              echo "**Windows, pick one:**"
              echo "- **Portable:** extract the zip straight into the folder that has \`swkotor.exe\` (for GOG usually \`C:\\GOG Games\\Star Wars KOTOR (GOG)\`) and start the game. The zip *is* the install."
              echo "- **Installer:** extract anywhere and double-click \`KotorCoop.Agent.exe\`. It finds your GOG install (or asks you to pick the folder), copies everything in, and offers to launch. No PowerShell needed."
              echo
              echo "(A \`pwsh .\\install.ps1 -GameDir '...'\` script is also included for scripted/CLI installs, but neither of the two options above needs it.)"
              echo
              echo "It contains the plugin (\`dinput8.dll\`), the chain loader for sharing \`dinput8.dll\` with another mod, the agent, the override assets, \`coop.ini\` and a README that covers install, play and troubleshooting."
              echo
              echo "SHA-256 \`$zip_sha256\` ($zip_name) · \`$tgz_sha256\` ($tgz_name) · built by CI run [${{ steps.what.outputs.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ steps.what.outputs.run_id }}) from \`${sha:0:7}\`."
              echo
              if [ "$kind" = latest ]; then
                echo "> Rolling build of \`main\`: every push that passes build + test replaces this release. Numbered releases (v0.x.y) are the stable ones."
                echo
              fi
            } > notes.md
          }

          # A numbered release. Plain-language notes live in docs/release-notes/<tag>.md when
          # present (written by hand for players); otherwise GitHub's generated change list is
          # appended. --latest makes it the repository's "Latest" release.
          create_numbered() {
            local vtag="$1"
            make_notes "$vtag" tag
            local extra=(--generate-notes)
            if git cat-file -e "$sha:docs/release-notes/$vtag.md" 2>/dev/null; then
              git show "$sha:docs/release-notes/$vtag.md" > human-notes.md
              { cat human-notes.md; echo; echo "---"; echo; cat notes.md; } > notes-final.md
              mv notes-final.md notes.md
              extra=()
            fi
            gh release create "$vtag" "$zip" "$tgz" --target "$sha" --title "$vtag" \
              --notes-file notes.md "${extra[@]}" --latest
          }

          if [ "$kind" = tag ]; then
            create_numbered "$ref"
          else
            # The VERSION file names the release this commit belongs to. The first green build
            # of a VERSION nobody has released yet becomes a real, numbered GitHub release
            # (marked Latest), so bumping VERSION is all it takes to publish one. Every build
            # also refreshes the rolling pre-release below.
            ver=$(git show "$sha:VERSION" 2>/dev/null | tr -d '[:space:]' || true)
            if [ -n "$ver" ] && ! gh release view "v$ver" >/dev/null 2>&1; then
              create_numbered "v$ver"
            fi

            make_notes latest latest
            # One rolling pre-release that always points at the newest green main build.
            # Delete + recreate rather than upload --clobber so the tag moves to the new sha
            # and the notes say which commit it is.
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest "$zip" "$tgz" --prerelease --target "$sha" \
              --title "latest (main @ ${sha:0:7})" --notes-file notes.md
          fi
