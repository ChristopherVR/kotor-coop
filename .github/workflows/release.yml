# Every successful push CI on main publishes an incremented release, then updates Nexus.
# Check out the tested SHA, not the moving main tip. A release-only commit stamps VERSION
# so the tagged source matches the binaries, without a bot commit/push loop on main.
# Manual runs publish on main by default; dry_run explicitly rehearses on any branch.
name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing (allowed on any branch)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
  # Preserve pending releases when several pushes finish CI during another release.
  queue: max
jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate manual publication target
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !inputs.dry_run
        shell: pwsh
        run: throw 'Manual publication requires main. Select dry_run to rehearse another branch.'

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.113'  # exact: the SDK picks the runtime pack, and third-party/manifest.json audits 10.0.13

      - name: Prepare release version and source tag
        id: version
        shell: pwsh
        run: |
          $arguments = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $arguments = @('--tag', $env:GITHUB_REF_NAME) }
          python tools/publication/release_version.py @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test
        shell: pwsh
        run: |
          dotnet build KotorCoop.slnx -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/KotorCoop.Tests --no-build --filter 'Category!=Soak&Category!=LocalOnly'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/publication -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 is not available' }

      - name: Package
        shell: pwsh
        run: |
          pwsh tools/package.ps1 -Version '${{ steps.version.outputs.version }}' -WarnAsError -OutDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($suffix in 'setup.exe', 'windows.zip', 'linux.tar.gz') {
            if (-not (Test-Path "dist/kotor-coop-${{ steps.version.outputs.version }}-$suffix")) { throw "Missing $suffix" }
          }

      - name: Verify the packaged installer
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "dist/kotor-coop-${{ steps.version.outputs.version }}-windows.zip" -DestinationPath artifacts/windows-package
          pwsh tools/verify-package.ps1 -PackageDirectory artifacts/windows-package -WorkDirectory artifacts/windows-installer-check
          if ($LASTEXITCODE -ne 0) { throw 'Packaged installer verification failed' }

      # Defender on the runner scans the zip and its extracted files. Informational: a
      # runner whose definitions cannot update must not block a release, but a detection
      # is visible in the log and the report is attached when it was produced.
      - name: Antivirus scan (Windows Defender)
        id: scan
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh tools/Scan-PublicPackage.ps1 -Archive "dist/kotor-coop-${{ steps.version.outputs.version }}-windows.zip" -Version '${{ steps.version.outputs.version }}' -OutputDirectory artifacts/scan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksums and release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          Set-Location dist
          $files = Get-ChildItem "kotor-coop-$version-setup.exe", "kotor-coop-$version-windows.zip", "kotor-coop-$version-linux.tar.gz"
          $files | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii SHA256SUMS.txt
          if (Test-Path ../artifacts/scan/scan-report.json) { Copy-Item ../artifacts/scan/scan-report.json . }
          $notes = @("../docs/release-notes/public-playtest-$version.md", "../docs/release-notes/v$version.md") | Where-Object { Test-Path $_ } | Select-Object -First 1
          $body = if ($notes) { Get-Content $notes -Raw } else { '' }
          $body += @"

          ---
          **Install:** run ``kotor-coop-$version-setup.exe`` (it finds your GOG or Steam copy), or extract the ZIP into its own folder and run ``KotorCoop.Agent.exe``. Steam Deck / Linux: use the tarball and its ``install.sh``.
          **Verify:** compare the SHA-256 of what you downloaded with ``SHA256SUMS.txt``. The files are not code-signed, so SmartScreen may warn.
          **Source:** the "Source code" archive on this release is the exact corresponding source for these binaries (GPL-3.0-only with the KOTOR 1 linking permission).
          Experimental software: back up your saves before first use.
          "@
          Set-Content -Encoding utf8 ../release-notes.md $body

      # Nexus discourages a bare .exe as the main file and manages old versions itself, so the
      # Nexus file is a zip holding the one-click setup program and a short note. The
      # description is the release notes as plain text, so it reads the same whether or not
      # the Nexus field renders BBCode.
      - name: Build the Nexus file
        id: nexusfile
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $stage = 'artifacts/nexus-stage'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "dist/kotor-coop-$version-setup.exe" $stage
          @"
          KOTOR Co-op $version
          ====================

          1. Close KOTOR.
          2. Run kotor-coop-$version-setup.exe. It finds your GOG or Steam copy (or lets you pick the folder).
          3. Start KOTOR and press Co-op on the main menu.

          Experimental: back up your saves first. Both players need the same version.
          Source, issues, checksums and the full guide: https://github.com/ChristopherVR/kotor-coop
          "@ -split "`n" | ForEach-Object { $_.TrimStart() } | Set-Content -Encoding utf8 "$stage/READ-ME-FIRST.txt"
          New-Item -ItemType Directory -Force artifacts/nexus | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/nexus/kotor-coop-$version-nexus.zip" -Force
          $notes = if (Test-Path release-notes.md) { Get-Content release-notes.md -Raw } else { '' }
          $notes = ($notes -replace '(?m)^#+\s*', '' -replace '\*\*', '' -replace '`', '').Trim()
          "KOTOR Co-op $version`n`n$notes`n`nSource and checksums: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}" |
            Set-Content -Encoding utf8 artifacts/nexus/description.txt

      - name: Publish the GitHub release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Keep published bytes on retries; resume a draft if an asset upload was interrupted.
          $existing = gh release view $tag --json isDraft 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and -not ($existing | ConvertFrom-Json).isDraft) { exit 0 }
          $assets = @(Get-ChildItem dist/kotor-coop-$version-setup.exe, dist/kotor-coop-$version-windows.zip, dist/kotor-coop-$version-linux.tar.gz, dist/SHA256SUMS.txt, artifacts/nexus/* | ForEach-Object FullName)
          if (Test-Path dist/scan-report.json) { $assets += (Resolve-Path dist/scan-report.json).Path }
          $flags = @()
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          if (-not $exists) {
            gh release create $tag --draft --verify-tag --title "kotor-coop $version" --notes-file release-notes.md @flags
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Published https://github.com/${{ github.repository }}/releases/tag/$tag" >> $env:GITHUB_STEP_SUMMARY

      # For a manual rehearsal the packages are kept for a few days instead of published.
      - name: Keep rehearsal packages
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: release-rehearsal
          path: |
            dist/kotor-coop-*-setup.exe
            dist/kotor-coop-*-windows.zip
            dist/kotor-coop-*-linux.tar.gz
            dist/SHA256SUMS.txt
          retention-days: 3

  # The workflow-level queue serializes GitHub and Nexus publication together.
  nexus:
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Check whether this release already reached Nexus
        id: published
        run: |
          published=$(gh release view "$RELEASE_TAG" --json assets --jq 'any(.assets[]; .name == "nexus-published.json")')
          echo "done=$published" >> "$GITHUB_OUTPUT"

      - name: Check for Nexus Mods credentials
        if: steps.published.outputs.done != 'true'
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          FILE_ID: ${{ vars.NEXUS_FILE_ID }}
        run: |
          if [ -z "$NEXUSMODS_API_KEY" ] || ! [[ "$FILE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Set NEXUSMODS_API_KEY and a numeric NEXUS_FILE_ID; Nexus publication is required."
            exit 1
          fi

      # Use the immutable release assets, including on retries, with no Actions storage dependency.
      - name: Download the published Nexus file
        if: steps.published.outputs.done != 'true'
        run: gh release download "$RELEASE_TAG" --pattern '*-nexus.zip' --pattern 'description.txt' --dir nexus

      - name: Read the description
        if: steps.published.outputs.done != 'true'
        id: version
        run: |
          delimiter="NEXUS_$(cat /proc/sys/kernel/random/uuid)"
          {
            echo "body<<$delimiter"
            cat nexus/description.txt
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods (mod 1910)
        if: steps.published.outputs.done != 'true'
        id: upload
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: nexus/kotor-coop-${{ needs.release.outputs.version }}-nexus.zip
          version: ${{ needs.release.outputs.version }}
          display_name: KOTOR Co-op ${{ needs.release.outputs.version }} (one-click installer)
          description: ${{ steps.version.outputs.body }}
          category: main
          primary_mod_manager_download: true
          archive_existing_version: true
          update_mod_version: true

      - name: Record the Nexus publication for retries
        if: steps.published.outputs.done != 'true'
        env:
          NEXUS_VERSION_ID: ${{ steps.upload.outputs.version_id }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          test -n "$NEXUS_VERSION_ID" || { echo '::error::Nexus returned no version ID'; exit 1; }
          jq -n --arg version "$RELEASE_VERSION" --arg id "$NEXUS_VERSION_ID" \
            '{version: $version, nexusVersionId: $id}' > nexus-published.json
          gh release upload "$RELEASE_TAG" nexus-published.json --clobber
          echo "Published KOTOR Co-op $RELEASE_VERSION to https://www.nexusmods.com/mod/1910" >> "$GITHUB_STEP_SUMMARY"
