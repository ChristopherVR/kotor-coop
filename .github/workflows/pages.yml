# Publishes site/ to GitHub Pages. Plain static files, no build step: the folder is uploaded
# as-is whenever something under it changes on main (or on demand from the Actions tab).
#
# One-time setup on the repository: Settings -> Pages -> Source: "GitHub Actions". Pages on a
# private repository needs a paid GitHub plan; on a public repository it is free.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
